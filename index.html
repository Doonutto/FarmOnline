<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demonz-Hunter Online</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0b0c10; color: #c5c6c7; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; user-select: none; }
        
        #ui-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; }
        .interactive { pointer-events: auto; }
        
        /* Screens */
        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, #1f2833 0%, #0b0c10 100%); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; }
        .panel { background: rgba(31, 40, 51, 0.95); border: 2px solid #66fcf1; border-radius: 12px; padding: 25px; width: 440px; box-shadow: 0 0 25px rgba(102, 252, 241, 0.3); text-align: center; }
        h1 { color: #66fcf1; font-size: 26px; margin-bottom: 15px; text-shadow: 0 0 10px rgba(102,252,241,0.5); letter-spacing: 2px; }
        
        .form-group { margin-bottom: 12px; text-align: left; }
        label { display: block; font-size: 12px; color: #45a29e; margin-bottom: 4px; font-weight: bold; }
        input[type="text"], select { width: 100%; padding: 8px; background: #0b0c10; border: 1px solid #45a29e; color: #fff; border-radius: 6px; font-size: 14px; }
        
        .color-picker-row { display: flex; gap: 10px; align-items: center; }
        input[type="color"] { -webkit-appearance: none; border: none; width: 36px; height: 36px; border-radius: 6px; cursor: pointer; background: none; }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: 1px solid #45a29e; border-radius: 6px; }

        .btn { background: #66fcf1; color: #0b0c10; font-weight: bold; padding: 10px; width: 100%; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; transition: 0.2s; margin-top: 8px; box-shadow: 0 0 10px rgba(102,252,241,0.4); }
        .btn:hover { background: #45a29e; color: #fff; transform: translateY(-2px); }

        /* HUD */
        #hud { display: none; width: 100%; height: 100%; position: absolute; top: 0; left: 0; pointer-events: none; }
        .hud-top { display: flex; justify-content: space-between; width: 100%; padding: 15px; }
        .player-status { background: rgba(11, 12, 16, 0.85); border: 1px solid #45a29e; padding: 12px; border-radius: 8px; width: 250px; pointer-events: auto; }
        .bar-container { background: #1f2833; height: 12px; border-radius: 6px; overflow: hidden; margin-top: 6px; border: 1px solid #45a29e; }
        #hp-bar { background: #e74c3c; height: 100%; width: 100%; transition: width 0.3s; }

        /* Minimap */
        #minimap-box { background: rgba(11, 12, 16, 0.85); border: 1px solid #45a29e; border-radius: 8px; width: 160px; height: 160px; position: relative; overflow: hidden; pointer-events: auto; }
        #minimapCanvas { width: 100%; height: 100%; }

        /* Chat */
        #chat-box { position: absolute; bottom: 20px; left: 20px; width: 320px; background: rgba(11, 12, 16, 0.85); border: 1px solid #45a29e; border-radius: 8px; padding: 10px; pointer-events: auto; display: flex; flex-direction: column; }
        #chat-messages { height: 120px; overflow-y: auto; font-size: 12px; margin-bottom: 8px; display: flex; flex-direction: column; gap: 4px; word-break: break-all; }
        .chat-msg { background: rgba(255,255,255,0.05); padding: 3px 6px; border-radius: 4px; }
        #chat-input { background: #0b0c10; border: 1px solid #45a29e; color: #fff; padding: 6px; border-radius: 4px; font-size: 12px; }

        /* Controls */
        #controls-hint { position: absolute; bottom: 20px; right: 20px; background: rgba(11, 12, 16, 0.85); border: 1px solid #45a29e; padding: 10px 15px; border-radius: 8px; font-size: 12px; text-align: right; pointer-events: auto; }

        canvas { display: block; }
    </style>
</head>
<body>

    <!-- หน้าสร้างตัวละคร -->
    <div id="create-screen" class="screen">
        <div class="panel interactive">
            <h1>DEMONZ-HUNTER</h1>
            <div class="form-group">
                <label>ชื่อนักล่า (Hunter Name)</label>
                <input type="text" id="input-name" value="ShadowHunter" maxlength="12">
            </div>
            <div class="form-group">
                <label>คลาสอาชีพ (Class)</label>
                <select id="input-class">
                    <option value="BladeMaster">🗡️ Blade Master (นักดาบคลั่ง)</option>
                    <option value="SoulWeaver">🔮 Soul Weaver (จอมเวทวิญญาณ)</option>
                    <option value="ShadowArcher">🏹 Shadow Archer (พลธนูเงา)</option>
                </select>
            </div>
            <div class="form-group">
                <label>สีชุดเกราะนักล่า (Armor Color)</label>
                <div class="color-picker-row">
                    <input type="color" id="input-color" value="#66fcf1">
                    <span style="font-size: 13px; color: #c5c6c7;">เลือกสีประจำตัวของคุณ</span>
                </div>
            </div>
            <button class="btn interactive" onclick="startOnlineGame()">เข้าสู่โลกนักล่าออนไลน์</button>
        </div>
    </div>

    <!-- หน้าจอเกมหลัก -->
    <div id="hud">
        <div class="hud-top">
            <div class="player-status">
                <div style="font-weight: bold; color: #66fcf1; display: flex; justify-content: space-between;">
                    <span id="hud-name">Hunter</span>
                    <span id="hud-level" style="color: #f1c40f;">Lv.1</span>
                </div>
                <div style="font-size: 11px; color: #45a29e; margin-bottom: 4px;" id="hud-class">Blade Master</div>
                <div style="font-size: 11px; display: flex; justify-content: space-between;"><span>HP</span><span id="hud-hp-text">100/100</span></div>
                <div class="bar-container"><div id="hp-bar"></div></div>
                <div style="margin-top: 6px; font-size: 11px; color: #f39c12;">ทอง: <span id="hud-gold">0</span> G | EXP: <span id="hud-exp">0</span></div>
            </div>
            <div id="minimap-box">
                <canvas id="minimapCanvas" width="160" height="160"></canvas>
            </div>
        </div>

        <div id="chat-box">
            <div id="chat-messages"></div>
            <input type="text" id="chat-input" placeholder="พิมพ์ข้อความคุยกับผู้เล่นอื่น..." onkeydown="handleChatInput(event)">
        </div>

        <div id="controls-hint">
            <b>WASD / ลูกศร</b> : เดิน<br>
            <b>คลิกซ้าย</b> : โจมตีมอนสเตอร์ / เดิน<br>
            <b>พื้นที่เมือง</b> : คุย NPC เควส/ร้านค้า
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, update, remove, onDisconnect, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // URL ฐานข้อมูลของคุณ (อัปเดตตามที่ตั้งค่า Firebase)
        const firebaseConfig = {
            databaseURL: "https://mmorpg-dmhunteronline-default-rtdb.asia-southeast1.firebasedatabase.app/"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.db = db;
        window.ref = ref;
        window.set = set;
        window.onValue = onValue;
        window.update = update;
        window.remove = remove;
        window.onDisconnect = onDisconnect;
        window.push = push;
    </script>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const minimapCanvas = document.getElementById('minimapCanvas');
        const miniCtx = minimapCanvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        let myPlayerId = 'player_' + Math.random().toString(36).substr(2, 9);
        let playerData = null;
        let otherPlayers = {};
        let keys = {};
        let targetPos = null;

        const WORLD_SIZE = 3000;

        // NPC และ มอนสเตอร์ในเกม
        const npcs = [
            { id: 'npc1', name: 'ผู้เฒ่าเอเดน (เควส)', x: 1400, y: 1400, color: '#f39c12', type: 'quest' },
            { id: 'npc2', name: 'แม่ค้าลิลลี่ (ร้านค้า)', x: 1600, y: 1400, color: '#e84393', type: 'shop' },
            { id: 'npc3', name: 'ช่างตีเหล็กบรอนซ์', x: 1500, y: 1300, color: '#fdcb6e', type: 'smith' }
        ];

        let monsters = [
            { id: 'm1', name: 'Slime พิษ', x: 1200, y: 1200, hp: 30, maxHp: 30, color: '#00b894', radius: 14 },
            { id: 'm2', name: 'Imp ร้าย', x: 1800, y: 1600, hp: 50, maxHp: 50, color: '#d63031', radius: 16 },
            { id: 'm3', name: 'Demon Guard', x: 2000, y: 1200, hp: 100, maxHp: 100, color: '#6c5ce7', radius: 20 }
        ];

        window.addEventListener('keydown', e => { keys[e.code] = true; });
        window.addEventListener('keyup', e => { keys[e.code] = false; });

        // คลิกเมาส์เดินหรือโจมตี
        canvas.addEventListener('click', e => {
            if (!playerData) return;
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;
            
            const worldClickX = clickX - canvas.width / 2 + playerData.x;
            const worldClickY = clickY - canvas.height / 2 + playerData.y;

            // เช็คคลิกตบมอนสเตอร์
            let clickedMonster = false;
            monsters.forEach(m => {
                let dist = Math.hypot(m.x - worldClickX, m.y - worldClickY);
                let pDist = Math.hypot(m.x - playerData.x, m.y - playerData.y);
                if (dist < 30) {
                    clickedMonster = true;
                    if (pDist < 80) {
                        // โจมตีมอนสเตอร์
                        m.hp -= 20;
                        if (m.hp <= 0) {
                            m.hp = m.maxHp;
                            m.x = playerData.x + (Math.random() * 400 - 200);
                            m.y = playerData.y + (Math.random() * 400 - 200);
                            playerData.gold = (playerData.gold || 0) + 15;
                            playerData.exp = (playerData.exp || 0) + 25;
                            if (playerData.exp >= 100) {
                                playerData.level = (playerData.level || 1) + 1;
                                playerData.exp = 0;
                                document.getElementById('hud-level').innerText = 'Lv.' + playerData.level;
                            }
                            document.getElementById('hud-gold').innerText = playerData.gold;
                            document.getElementById('hud-exp').innerText = playerData.exp;
                        }
                    } else {
                        targetPos = { x: m.x, y: m.y };
                    }
                }
            });

            // เช็คคลิกคุย NPC
            npcs.forEach(n => {
                let dist = Math.hypot(n.x - worldClickX, n.y - worldClickY);
                if (dist < 30) {
                    alert(`[ระบบ ${n.name}] ยินดีต้อนรับนักล่า ${playerData.name}! จงกำจัดมอนสเตอร์ในดินแดนนี้ให้สิ้นซาก!`);
                }
            });

            if (!clickedMonster) {
                targetPos = { x: worldClickX, y: worldClickY };
            }
        });

        function startOnlineGame() {
            const name = document.getElementById('input-name').value || 'Hunter';
            const charClass = document.getElementById('input-class').value;
            const color = document.getElementById('input-color').value;

            playerData = {
                id: myPlayerId,
                name: name,
                charClass: charClass,
                color: color,
                x: 1500 + Math.random() * 100 - 50,
                y: 1500 + Math.random() * 100 - 50,
                hp: 100,
                maxHp: 100,
                level: 1,
                gold: 0,
                exp: 0
            };

            document.getElementById('create-screen').style.display = 'none';
            document.getElementById('hud').style.display = 'block';

            document.getElementById('hud-name').innerText = playerData.name;
            document.getElementById('hud-class').innerText = playerData.charClass;

            initFirebaseMultiplayer();
            requestAnimationFrame(gameLoop);
        }

        function initFirebaseMultiplayer() {
            const playerRef = window.ref(window.db, 'players/' + myPlayerId);
            window.set(playerRef, playerData);
            window.onDisconnect(playerRef).remove();

            const allPlayersRef = window.ref(window.db, 'players');
            window.onValue(allPlayersRef, (snapshot) => {
                const data = snapshot.val();
                if (data) otherPlayers = data;
                else otherPlayers = {};
            });

            const chatRef = window.ref(window.db, 'chats');
            window.onValue(chatRef, (snapshot) => {
                const data = snapshot.val();
                const chatBox = document.getElementById('chat-messages');
                chatBox.innerHTML = '';
                if (data) {
                    Object.values(data).slice(-20).forEach(chat => {
                        const div = document.createElement('div');
                        div.className = 'chat-msg';
                        div.innerHTML = `<b style="color: #66fcf1;">${chat.name}</b>: ${chat.text}`;
                        chatBox.appendChild(div);
                    });
                    chatBox.scrollTop = chatBox.scrollHeight;
                }
            });
        }

        function handleChatInput(e) {
            if (e.key === 'Enter') {
                const input = document.getElementById('chat-input');
                const text = input.value.trim();
                if (text && playerData) {
                    const chatRef = window.ref(window.db, 'chats');
                    window.push(chatRef, { name: playerData.name, text: text, time: Date.now() });
                    input.value = '';
                }
            }
        }

        let lastSyncTime = 0;
        function updatePlayer() {
            if (!playerData) return;
            let speed = 4;
            let moved = false;

            if (keys['KeyW'] || keys['ArrowUp']) { playerData.y -= speed; moved = true; targetPos = null; }
            if (keys['KeyS'] || keys['ArrowDown']) { playerData.y += speed; moved = true; targetPos = null; }
            if (keys['KeyA'] || keys['ArrowLeft']) { playerData.x -= speed; moved = true; targetPos = null; }
            if (keys['KeyD'] || keys['ArrowRight']) { playerData.x += speed; moved = true; targetPos = null; }

            if (targetPos) {
                let dx = targetPos.x - playerData.x;
                let dy = targetPos.y - playerData.y;
                let dist = Math.hypot(dx, dy);
                if (dist > 4) {
                    playerData.x += (dx / dist) * speed;
                    playerData.y += (dy / dist) * speed;
                    moved = true;
                } else {
                    targetPos = null;
                }
            }

            playerData.x = Math.max(50, Math.min(WORLD_SIZE - 50, playerData.x));
            playerData.y = Math.max(50, Math.min(WORLD_SIZE - 50, playerData.y));

            let now = Date.now();
            if (moved && (now - lastSyncTime > 50)) {
                const playerRef = window.ref(window.db, 'players/' + myPlayerId);
                window.update(playerRef, { x: playerData.x, y: playerData.y });
                lastSyncTime = now;
            }
        }

        function drawWorld() {
            ctx.fillStyle = '#0b0c10';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (!playerData) return;

            ctx.save();
            ctx.translate(canvas.width / 2 - playerData.x, canvas.height / 2 - playerData.y);

            // พื้นหลังกริด
            ctx.strokeStyle = '#1f2833';
            ctx.lineWidth = 2;
            let gridSize = 100;
            for (let x = 0; x <= WORLD_SIZE; x += gridSize) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, WORLD_SIZE); ctx.stroke();
            }
            for (let y = 0; y <= WORLD_SIZE; y += gridSize) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(WORLD_SIZE, y); ctx.stroke();
            }

            // ขอบเขตโลก
            ctx.strokeStyle = '#66fcf1';
            ctx.lineWidth = 5;
            ctx.strokeRect(0, 0, WORLD_SIZE, WORLD_SIZE);

            // วาด NPC
            npcs.forEach(n => {
                ctx.fillStyle = n.color;
                ctx.beginPath();
                ctx.arc(n.x, n.y, 18, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.fillStyle = '#f1c40f';
                ctx.font = 'bold 12px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(`⭐ ${n.name}`, n.x, n.y - 24);
            });

            // วาดมอนสเตอร์
            monsters.forEach(m => {
                ctx.fillStyle = m.color;
                ctx.beginPath();
                ctx.arc(m.x, m.y, m.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.stroke();

                // เลือดมอนสเตอร์
                ctx.fillStyle = 'red';
                ctx.fillRect(m.x - 20, m.y - m.radius - 12, 40, 5);
                ctx.fillStyle = 'green';
                ctx.fillRect(m.x - 20, m.y - m.radius - 12, 40 * (m.hp / m.maxHp), 5);

                ctx.fillStyle = '#fff';
                ctx.font = '11px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(m.name, m.x, m.y - m.radius - 16);
            });

            // วาดผู้เล่นทั้งหมด
            for (let id in otherPlayers) {
                let p = otherPlayers[id];
                ctx.save();
                ctx.translate(p.x, p.y);

                ctx.beginPath();
                ctx.arc(0, 0, 22, 0, Math.PI * 2);
                ctx.fillStyle = p.color || '#66fcf1';
                ctx.globalAlpha = 0.3;
                ctx.fill();
                ctx.globalAlpha = 1.0;

                ctx.beginPath();
                ctx.arc(0, 0, 16, 0, Math.PI * 2);
                ctx.fillStyle = p.color || '#66fcf1';
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#ffffff';
                ctx.stroke();

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 13px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(`${p.name} (Lv.${p.level || 1})`, 0, -26);

                ctx.restore();
            }

            ctx.restore();
        }

        function drawMinimap() {
            miniCtx.fillStyle = '#0b0c10';
            miniCtx.fillRect(0, 0, minimapCanvas.width, minimapCanvas.height);

            if (!playerData) return;
            let scale = minimapCanvas.width / WORLD_SIZE;

            // มอนสเตอร์บนมินิแมป
            monsters.forEach(m => {
                miniCtx.fillStyle = '#e74c3c';
                miniCtx.fillRect(m.x * scale - 2, m.y * scale - 2, 4, 4);
            });

            // ผู้เล่นบนมินิแมป
            for (let id in otherPlayers) {
                let p = otherPlayers[id];
                miniCtx.fillStyle = p.id === myPlayerId ? '#66fcf1' : '#f39c12';
                miniCtx.beginPath();
                miniCtx.arc(p.x * scale, p.y * scale, p.id === myPlayerId ? 4 : 2.5, 0, Math.PI * 2);
                miniCtx.fill();
            }
        }

        function gameLoop() {
            updatePlayer();
            drawWorld();
            drawMinimap();
            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
